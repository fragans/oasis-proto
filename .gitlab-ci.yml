image: node:22-slim

# Use a default tag for all jobs. 
# This is often required for runners on private GitLab instances to pick up jobs.
default:
  tags:
    - docker

stages:
  - test
  - build
  - deploy

variables:
  OBSUTIL_URL: "https://obs-community-intl.obs.ap-southeast-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz"

# Cache node_modules and npm cache for faster builds
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# Continuous Integration job (lint & typecheck)
ci:
  stage: test
  before_script:
    - npm config set cache "$(pwd)/.npm"
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# Build Templates
.build_template:
  stage: build
  script:
    - npm ci
    - npx nuxi generate
  artifacts:
    paths:
      - .output/public
    expire_in: 1 hour

build:staging:
  extends: .build_template
  variables:
    NODE_ENV: "staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

build:prod:
  extends: .build_template
  variables:
    NODE_ENV: "production"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Deploy Templates
.deploy_template:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl tar
    - curl -LO $OBSUTIL_URL
    - tar -xzf obsutil_linux_amd64.tar.gz
    - mv obsutil_linux_amd64_*/obsutil /usr/local/bin/obsutil
    - chmod +x /usr/local/bin/obsutil
    - obsutil config -i=$S3_ACCESS_KEY_ID -k=$S3_SECRET_ACCESS_KEY -e=$S3_ENDPOINT
  script:
    # Upload public folder contents to the specific target path in the bucket
    - obsutil cp .output/public obs://$S3_BUCKET/$TARGET_PATH -f -r

deploy:staging:
  extends: .deploy_template
  variables:
    TARGET_PATH: "staging/"
  dependencies:
    - build:staging
  environment:
    name: staging
    url: https://staging-oasis.kgmedia.id/
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

deploy:production:
  extends: .deploy_template
  variables:
    TARGET_PATH: ""
  dependencies:
    - build:prod
  environment:
    name: production
    url: https://oasis.kgmedia.id/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
