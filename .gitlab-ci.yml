# image: node:20-slim (Disabled because runner is monolithic/shell)

stages:
  - test
  - build
  - migrate
  - deploy

variables:
  OBSUTIL_URL: "https://obs-community-intl.obs.ap-southeast-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz"

# Cache node_modules and npm cache for faster builds
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# Continuous Integration job (lint & typecheck)
ci:
  stage: test
  before_script:
    - npm config set cache "$(pwd)/.npm"
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# Build Templates
.build_template:
  stage: build
  script:
    - npm ci
    - cp $ENV_FILE .env
    - npx nuxi generate
  artifacts:
    paths:
      - .output/public
    expire_in: 1 hour

build:staging:
  extends: .build_template
  variables:
    NODE_ENV: "staging"
    ENV_FILE: ".env.staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

build:prod:
  extends: .build_template
  variables:
    NODE_ENV: "production"
    ENV_FILE: ".env.prod"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Migration Templates
.migrate_template:
  stage: migrate
  script:
    - npm ci
    - cp $ENV_FILE .env
    - npx drizzle-kit migrate
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"

migrate:staging:
  extends: .migrate_template
  variables:
    ENV_FILE: ".env.staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

migrate:production:
  extends: .migrate_template
  variables:
    ENV_FILE: ".env.prod"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# Deploy Templates
.deploy_template:
  stage: deploy
  # image: alpine:latest (Disabled because runner is monolithic/shell)
  before_script:
    # Ensure dependencies are available (assuming curl and tar are pre-installed on the monolithic server)
    - curl -LO $OBSUTIL_URL
    - tar -xzf obsutil_linux_amd64.tar.gz
    # Use the binary directly from the extracted folder to avoid needing sudo for /usr/local/bin
    - chmod +x obsutil_linux_amd64_*/obsutil
    - ./obsutil_linux_amd64_*/obsutil config -i=$S3_ACCESS_KEY_ID -k=$S3_SECRET_ACCESS_KEY -e=$S3_ENDPOINT
  script:
    # Upload public folder contents to the specific target path in the bucket using local binary
    - ./obsutil_linux_amd64_*/obsutil cp .output/public obs://$S3_BUCKET/$TARGET_PATH -f -r

deploy:staging:
  extends: .deploy_template
  variables:
    TARGET_PATH: "staging/"
  dependencies:
    - build:staging
  environment:
    name: staging
    url: https://staging-oasis.kgmedia.id/
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

deploy:production:
  extends: .deploy_template
  variables:
    TARGET_PATH: ""
  dependencies:
    - build:prod
  environment:
    name: production
    url: https://oasis.kgmedia.id/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
