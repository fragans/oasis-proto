image: node:22-slim

stages:
  - test
  - build
  - deploy

variables:
  OBSUTIL_URL: "https://obs-community-intl.obs.ap-southeast-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz"

# Cache node_modules and npm cache for faster builds
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# Continuous Integration job (lint & typecheck)
ci:
  stage: test
  before_script:
    - npm config set cache "$(pwd)/.npm"
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Build job - generates static assets
build:
  stage: build
  script:
    - npm ci
    - npx nuxi generate
  artifacts:
    paths:
      - .output/public
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Deploy job - uploads to Huawei OBS
deploy:obs:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build
  before_script:
    - apk add --no-cache curl tar
    - curl -LO $OBSUTIL_URL
    - tar -xzf obsutil_linux_amd64.tar.gz
    - mv obsutil_linux_amd64_*/obsutil /usr/local/bin/obsutil
    - chmod +x /usr/local/bin/obsutil
    - obsutil config -i=$S3_ACCESS_KEY_ID -k=$S3_SECRET_ACCESS_KEY -e=$S3_ENDPOINT
  script:
    # Sync public folder to OBS bucket root
    - obsutil cp .output/public obs://$S3_BUCKET/ -f -r
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
